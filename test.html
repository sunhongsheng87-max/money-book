<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诊断测试</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:20px;background:#f5f5f5;">
  <h2>诊断测试</h2>
  <div id="status"></div>
  <div id="app">{{ msg }}</div>
  <script>
    var s = document.getElementById('status');
    function log(t, ok) { s.innerHTML += '<p style="color:'+(ok?'green':'red')+'">'+(ok?'✅':'❌')+' '+t+'</p>'; }

    try {
      log('Vue 加载: '+typeof Vue, typeof Vue !== 'undefined');
      log('Dexie 加载: '+typeof Dexie, typeof Dexie !== 'undefined');

      var db = new Dexie('TestDB');
      db.version(1).stores({ test: '++id' });
      log('Dexie DB 创建', true);

      db.open().then(function() {
        log('IndexedDB 连接', true);

        var app = Vue.createApp({
          data: function() { return { msg: 'Vue 渲染成功！' }; },
          mounted: function() {
            log('Vue mounted() 调用', true);
          }
        });
        app.config.errorHandler = function(err) {
          log('Vue 错误: '+err, false);
        };
        app.mount('#app');
      }).catch(function(e) {
        log('IndexedDB 错误: '+e.message, false);
      });
    } catch(e) {
      log('致命错误: '+e.message, false);
    }
  </script>
</body>
</html>
